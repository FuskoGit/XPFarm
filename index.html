<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas>
<script>
const W=1920,H=1080,c=document.getElementById('c'),g=c.getContext('2d');
const UI='Tahoma,"Segoe UI",Verdana,"DejaVu Sans",sans-serif';
const MONO='"Lucida Console","Courier New",Consolas,"DejaVu Sans Mono",monospace';
const BEIGE='#ece9d8',EDGE='#aca899',SEL='#316ac5',GREEN='#008a00',RED='#c00000',INK='#000';
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ez=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eo=x=>{x=cl(x);return 1-Math.pow(1-x,3)};
const lerp=(a,b,k)=>a+(b-a)*k;
function A(a){return `rgba(255,255,255,${a})`}
function tc(s,x,y,sz,col='#000',al='left',wt='',font=UI){g.font=`${wt} ${sz}px ${font}`;g.textAlign=al;g.fillStyle=col;g.fillText(s,x,y)}
function txt(s,x,y,sz,a=1,al='left',wt=''){tc(s,x,y,sz,A(a),al,wt,MONO)}
function fmt(n){return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function money(n){return '$'+fmt(n)}
function lg(y0,y1,stops){const gr=g.createLinearGradient(0,y0,0,y1);stops.forEach(s=>gr.addColorStop(s[0],s[1]));return gr}

/* ================= state + streams ================= */
const S={phase:'desk',amount:'',start:100,focus:false,mx:-1,my:-1,down:false,seed:1,sel:false};
let K=1;
const TK=['LUMEN','MOTH','KIRA','GRAVY','OBELISK','NIMBUS','PIXL','VANTA','HALO','RUNE','ORBIT','MERC','DUSK','FERAL','QUILL','SABLE','TIDE','ZEN','CRUX','EMBER','ONYX','PRISM','ASH','BLOOM','COBALT','DRIFT','ECHO','FLINT','GLYPH','HUSK'];
const T0=7.2;
let trades,logs,bubs,rT,rL,rB,genT,genL,genB,balNow;
const VERBS=[
 (r,tk)=>`scan  new pair $${tk}  age 00:0${Math.floor(r()*9)}`,
 (r,tk)=>`check bundle $${tk}  clusters ${Math.floor(r()*3)}  ok`,
 (r,tk)=>`check dev wallet $${tk}  sold 0.0%`,
 (r,tk)=>`route buy $${tk}  slip 4%  prio 0.002`,
 (r,tk)=>`fill  $${tk}  ${(r()*.4+.1).toFixed(3)} SOL  ${Math.floor(180+r()*300)}ms`,
 (r,tk)=>`track smart wallets  +${Math.floor(r()*6+1)} entering $${tk}`,
 (r,tk)=>`risk  size ${RISK.size}%  sl -${RISK.sl}%  tp +${RISK.tp}%`,
 (r,tk)=>`holders $${tk}  ${Math.floor(200+r()*2000)}  top10 ${Math.floor(10+r()*15)}%`,
 (r,tk)=>`mev guard  $${tk}  protected`,
 (r,tk)=>`liquidity $${tk}  ${Math.floor(20+r()*180)}k  locked`,
 (r,tk)=>`pump.fun  new mint $${tk}  curve ${Math.floor(r()*30)}%`,
 (r,tk)=>`pump.fun  $${tk} curve ${Math.floor(60+r()*39)}%  near migration`,
 (r,tk)=>`pumpswap  $${tk} migrated  lp live`];
const BLINES=[[0,'new pair 3s old'],[0,'smart money in'],[1,'filled 412ms'],[1,'in at 38k mc'],[2,'size ok'],[2,'stop set'],[3,'tp 1/3 hit'],[3,'took profit'],[0,'dev clean'],[2,'bundle check ok'],[1,'second entry'],[3,'trail stop up'],[0,'kol wallet in'],[3,'runner left'],[2,'risk ok'],[1,'filled 298ms'],[0,'volume spike'],[3,'secured profit'],[1,'sniped block 1'],[2,'cut loser fast']];
const B58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';const QP=new URLSearchParams(location.search);
const PRESETS={conservative:{name:'Conservative',size:5,sl:8,tp:20,dl:5,dw:10},balanced:{name:'Balanced',size:10,sl:12,tp:35,dl:10,dw:25},aggressive:{name:'Aggressive',size:20,sl:20,tp:60,dl:20,dw:50}};
const PK=['conservative','balanced','aggressive'];let RISKI=Math.max(0,PK.indexOf((QP.get('risk')||'balanced').toLowerCase()));if(PK.indexOf((QP.get('risk')||'').toLowerCase())<0)RISKI=1;let RISK=PRESETS[PK[RISKI]];
let TEND=1e9,ENDR='',MAXT=50;
function planTrades(){const r=rT;const R=RISK;let bal=100,t=T0+.6;ENDR='';
 for(let i=0;i<MAXT;i++){const u=r();let pct,exit;
  if(u<.42){if(r()<.22){pct=R.tp*(.95+r()*.08);exit='TP'}else{pct=R.tp*(.28+r()*.34);exit='TP1'}}
  else if(u<.54){pct=(r()-.5)*3;exit='BE'}
  else{pct=-R.sl*(.55+r()*.5);exit='SL'}
  const size=bal*R.size/100,pnl=size*pct/100,after=bal+pnl;
  trades.push({t,tk:TK[i%TK.length],pct,exit,size,pnl,before:bal,after,age:(2+Math.floor(r()*40)),mint:Array.from({length:40},()=>B58[Math.floor(r()*58)]).join('')+'pump',mc:8000+r()*52000});
  bal=after;t+=1.6+r()*1.5;const ret=(bal/100-1)*100;if(ret>=R.dw){ENDR='win';break}if(ret<=-R.dl){ENDR='loss';break}}
 if(!ENDR)ENDR='time';TEND=trades[trades.length-1].t+.25}
function resetStreams(){const s=S.seed;trades=[];logs=[];bubs=[];rT=rng(77+s);rL=rng(5+s);rB=rng(21+s);genT=T0+.5;genL=T0-.2;genB=T0+.2;balNow=100;planTrades()}
resetStreams();
function ensure(t){const end=t+3;
 

 while(genL<end){const r=rL;const tk=TK[Math.floor(r()*TK.length)];logs.push({t:genL,s:VERBS[Math.floor(r()*VERBS.length)](r,tk)});genL+=.12+r()*.35;if(logs.length>400)logs.splice(0,200)}
 while(genB<end){const L=BLINES[bubs.length%BLINES.length];bubs.push({t:genB,a:L[0],s:L[1]});genB+=.7+rB()*.6;if(bubs.length>200)bubs.splice(0,100)}}
function idxBefore(t){let lo=0,hi=trades.length-1,ans=-1;while(lo<=hi){const m=(lo+hi)>>1;if(trades[m].t<=t){ans=m;lo=m+1}else hi=m-1}return ans}
function baseAt(t){if(t<T0)return 100;const i=idxBefore(t);if(i<0)return 100;const tr=trades[i];const b=t>=tr.t+.25?tr.after:lerp(tr.before,tr.after,eo((t-tr.t)/.25));return t>=TEND?b:b+Math.sin(t*9)*.004*b*Math.min(1,t-T0)}
function doneCount(t){return idxBefore(t-.25)+1}
function curTrade(t){const i=idxBefore(t);return i>=0?trades[i]:null}
const BOOT=()=>['C:\\XPFarm> xpfarm.exe --desk','loading agents ........ 4/4','connect rpc ........... 38ms','wallet linked ......... ok','balance ............... '+money(S.start),'venue ................. pump.fun','risk .................. '+RISK.name.toLowerCase()+'  sl -'+RISK.sl+'%  tp +'+RISK.tp+'%','day limits ............ +'+RISK.dw+'% / -'+RISK.dl+'%','scanner ............... live','starting session'];

const S3=[];{const r=rng(9);for(let i=0;i<1500;i++){const u=i/1500*Math.PI*2;const rr=2+Math.cos(5*u);S3.push([rr*Math.cos(3*u)+(r()-.5)*.05,rr*Math.sin(3*u)+(r()-.5)*.05,-Math.sin(5*u)+(r()-.5)*.05])}}
const S3N=[];{const r=rng(4);for(let i=0;i<14;i++){const u=r()*Math.PI*2;const rr=2+Math.cos(5*u);S3N.push([rr*Math.cos(3*u),rr*Math.sin(3*u),-Math.sin(5*u),TK[i]])}}
const CLU=[{n:'smart wallets',x:.13,y:.38,s:.07},{n:'fresh wallets',x:.36,y:.22,s:.06},{n:'snipers',x:.8,y:.3,s:.05},{n:'kols',x:.28,y:.76,s:.06},{n:'bundles',x:.72,y:.78,s:.055}];
const NP=[];{const r=rng(12);for(const k of CLU)for(let i=0;i<420;i++){const a=r()*6.283,d=Math.pow(r(),1.6)*k.s;NP.push([k.x+Math.cos(a)*d*1.4,k.y+Math.sin(a)*d*1.6,r()])}}
const FL=[];{const r=rng(31);for(let i=0;i<170;i++)FL.push({c:Math.floor(r()*CLU.length),o:r(),sp:.25+r()*.5,j:(r()-.5)*.08})}

/* ================= XP primitives ================= */
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function rrTop(x,y,w,h,r){g.beginPath();g.moveTo(x,y+h);g.lineTo(x,y+r);g.arcTo(x,y,x+r,y,r);g.lineTo(x+w-r,y);g.arcTo(x+w,y,x+w,y+r,r);g.lineTo(x+w,y+h);g.closePath()}
const TITLE=[[0,'#3d95ff'],[.1,'#0a6af3'],[.45,'#0058e6'],[.85,'#0050d8'],[1,'#003dbd']];
function capBtn(x,y,s,kind){rr(x,y,s,s,3);g.fillStyle=kind=='x'?lg(y,y+s,[[0,'#f0a088'],[.5,'#e0603e'],[1,'#c63a17']]):lg(y,y+s,[[0,'#8cb8ff'],[.5,'#3d7ff2'],[1,'#2257d8']]);g.fill();g.strokeStyle='#fff';g.lineWidth=1.3;g.stroke();
 g.strokeStyle='#fff';g.lineWidth=2.4;g.beginPath();const m=s*.3;
 if(kind=='x'){g.moveTo(x+m,y+m);g.lineTo(x+s-m,y+s-m);g.moveTo(x+s-m,y+m);g.lineTo(x+m,y+s-m)}
 else if(kind=='_'){g.moveTo(x+m,y+s-m);g.lineTo(x+s*.55,y+s-m)}
 else {g.lineWidth=1.6;g.strokeRect(x+m,y+m,s-2*m,s-2*m);g.fillStyle='#fff';g.fillRect(x+m,y+m,s-2*m,2.5)}
 g.stroke()}
function appIcon(x,y,s){g.save();rr(x,y,s,s,s*.2);g.fillStyle=lg(y,y+s,[[0,'#8fe07f'],[.5,'#2fa52a'],[1,'#1b6e17']]);g.fill();g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=Math.max(1,s*.03);g.stroke();
 g.fillStyle=lg(y,y+s*.5,[[0,'rgba(255,255,255,.5)'],[1,'rgba(255,255,255,0)']]);rr(x+s*.05,y+s*.05,s*.9,s*.42,s*.16);g.fill();
 g.beginPath();const p=[[.18,.72],[.36,.52],[.5,.62],[.78,.3]];p.forEach((q,i)=>i?g.lineTo(x+q[0]*s,y+q[1]*s):g.moveTo(x+q[0]*s,y+q[1]*s));g.strokeStyle='#fff';g.lineWidth=s*.09;g.lineCap='round';g.lineJoin='round';g.stroke();
 g.beginPath();g.moveTo(x+.62*s,y+.28*s);g.lineTo(x+.82*s,y+.26*s);g.lineTo(x+.8*s,y+.46*s);g.stroke();g.restore()}
function titleBar(x,y,w,h,title,icon=true){rrTop(x,y,w,h,8);g.fillStyle=lg(y,y+h,TITLE);g.fill();
 if(icon)appIcon(x+8,y+h/2-8,16);
 g.save();g.shadowColor='rgba(0,0,0,.5)';g.shadowOffsetX=1;g.shadowOffsetY=1;tc(title,x+(icon?32:10),y+h/2+5,Math.round(h*.46),'#fff','left','bold');g.restore();
 const s=h-8;capBtn(x+w-s-5,y+4,s,'x');capBtn(x+w-2*s-9,y+4,s,'o');capBtn(x+w-3*s-11,y+4,s,'_')}
function sunken(x,y,w,h,fill='#fff'){g.fillStyle=fill;g.fillRect(x,y,w,h);g.strokeStyle='#7f9db9';g.lineWidth=1;g.strokeRect(x+.5,y+.5,w-1,h-1)}
function xpBtn(x,y,w,h,label,hov,on,pr,sz=14){rr(x,y,w,h,4);g.fillStyle=on?lg(y,y+h,[[0,'#dce8fb'],[1,'#b8cff5']]):lg(y,y+h,[[0,'#ffffff'],[.85,'#ece9d8'],[1,'#d6d0bc']]);if(pr)g.fillStyle='#e0ddd0';g.fill();
 g.strokeStyle='#003c74';g.lineWidth=1;g.stroke();if(hov){rr(x+1.5,y+1.5,w-3,h-3,3);g.strokeStyle='#f8b330';g.lineWidth=2;g.stroke()}
 tc(label,x+w/2,y+h/2+sz*.36,sz,INK,'center')}
function panel(x,y,w,h,title,k){if(k<=0)return 0;const p=eo(k*1.4);g.save();
 const cx=x+w/2,cy=y+h/2,s=lerp(.6,1,p);g.globalAlpha=cl(k*2.5);g.translate(cx,cy);g.scale(s,s);g.translate(-cx,-cy);
 g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x+4,y+5,w,h);
 rrTop(x,y,w,h,8);g.fillStyle='#0831d9';g.fill();
 g.fillStyle=BEIGE;g.fillRect(x+4,y+28,w-8,h-32);titleBar(x,y,w,28,title);
 g.restore();return cl((k-.3)/.5)}
function clockStr(sec){const d=new Date();let h=d.getHours(),m=d.getMinutes();const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(m).padStart(2,'0')+(sec?':'+String(d.getSeconds()).padStart(2,'0'):'')+' '+ap}

/* ================= desktop (bliss-like) ================= */
function wallpaper(){g.fillStyle=lg(0,H,[[0,'#2b62c9'],[.35,'#5d95e6'],[.6,'#a9c9f2'],[1,'#cfe2f9']]);g.fillRect(0,0,W,H);
 const cr=rng(8);g.fillStyle='rgba(255,255,255,.6)';for(let i=0;i<8;i++){const x=cr()*W,y=60+cr()*330,s=60+cr()*120;g.beginPath();for(let j=0;j<6;j++){g.moveTo(x+j*s*.35+s*.45,y+Math.sin(j)*s*.12);g.ellipse(x+j*s*.35,y+Math.sin(j)*s*.12,s*.45,s*.22,0,0,7)}g.fill()}
 g.beginPath();g.moveTo(0,H*.62);g.bezierCurveTo(W*.25,H*.5,W*.55,H*.52,W*.78,H*.6);g.bezierCurveTo(W*.9,H*.64,W,H*.62,W,H*.63);g.lineTo(W,H);g.lineTo(0,H);g.closePath();
 const hg=g.createLinearGradient(0,H*.5,W*.3,H);hg.addColorStop(0,'#8fd14f');hg.addColorStop(.4,'#4f9e2c');hg.addColorStop(1,'#2f6e17');g.fillStyle=hg;g.fill();
 g.beginPath();g.moveTo(0,H*.8);g.bezierCurveTo(W*.4,H*.7,W*.7,H*.78,W,H*.74);g.lineTo(W,H);g.lineTo(0,H);g.closePath();g.fillStyle='rgba(40,100,20,.45)';g.fill()}
const TB=40;
function taskbar(app){const y=H-TB;g.fillStyle=lg(y,H,[[0,'#3e7ef7'],[.06,'#3168d5'],[.5,'#245edb'],[.9,'#1f4fc4'],[1,'#1941a5']]);g.fillRect(0,y,W,TB);
 g.beginPath();g.moveTo(0,y);g.lineTo(130,y);g.arcTo(150,y,150,y+TB/2,18);g.arcTo(150,H,130,H,18);g.lineTo(0,H);g.closePath();g.fillStyle=lg(y,H,[[0,'#6fc26a'],[.15,'#3c9b3c'],[.6,'#2f8f2a'],[1,'#25741f']]);g.fill();
 // xp-ish flag of 4 tiles
 appIcon(14,y+8,24);
 g.save();g.shadowColor='rgba(0,0,0,.5)';g.shadowOffsetX=1;g.shadowOffsetY=1;tc('start',48,y+28,23,'#fff','left','italic bold');g.restore();
 if(app){rr(160,y+4,240,TB-8,3);g.fillStyle=lg(y,H,[[0,'#1e4fc2'],[1,'#1a3f9e']]);g.fill();g.strokeStyle='rgba(0,0,0,.3)';g.stroke();
  appIcon(170,y+12,16);tc('XPFarm',194,y+26,14,'#fff')}
 const tw=150;g.fillStyle=lg(y,H,[[0,'#16a3f7'],[.5,'#0f8ae6'],[1,'#0b6cc6']]);g.fillRect(W-tw,y,tw,TB);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(W-tw,y,1,TB);
 tc(clockStr(false),W-18,y+26,14,'#fff','right');}
const ICON={x:W/2-60,y:H*.33,w:120,h:120};
function desktop(t){wallpaper();
 // other desktop icons
 [['My Computer',40,40],['Recycle Bin',40,170]].forEach(q=>{const [n,x,y]=q;rr(x+22,y,52,48,6);g.fillStyle=lg(y,y+48,[[0,'#d7e4f7'],[1,'#8aa8d8']]);g.fill();g.strokeStyle='rgba(0,0,40,.4)';g.stroke();
  g.save();g.shadowColor='rgba(0,0,0,.8)';g.shadowOffsetX=1;g.shadowOffsetY=1;tc(n,x+48,y+72,14,'#fff','center');g.restore()});
 const {x:ix,y:iy,w:iw}=ICON;const hov=inR(ICON);
 g.save();g.shadowColor='rgba(0,0,0,.35)';g.shadowOffsetY=6;g.shadowBlur=12;appIcon(ix,iy,iw);g.restore();
 if(hov||S.sel){g.fillStyle='rgba(49,106,197,.35)';rr(ix-8,iy-8,iw+16,iw+16,6);g.fill()}
 g.font=`16px ${UI}`;const lw=g.measureText('XPFarm.exe').width+12;if(S.sel){g.fillStyle=SEL;g.fillRect(W/2-lw/2,iy+iw+12,lw,24)}
 g.save();if(!S.sel){g.shadowColor='rgba(0,0,0,.9)';g.shadowOffsetX=1;g.shadowOffsetY=1}tc('XPFarm.exe',W/2,iy+iw+30,16,'#fff','center');g.restore();
 g.save();const hb=iy-62+Math.sin(t*3)*3;g.globalAlpha=.85+.15*Math.sin(t*3);rr(W/2-120,hb,240,36,18);g.fillStyle='rgba(0,30,90,.72)';g.fill();g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=1;g.stroke();tc('Double-click to open',W/2,hb+24,17,'#fff','center','bold');g.beginPath();g.moveTo(W/2-8,hb+36);g.lineTo(W/2,hb+44);g.lineTo(W/2+8,hb+36);g.fillStyle='rgba(0,30,90,.72)';g.fill();g.restore();
 taskbar(false)}

 ['File','Edit','View','Agents','Tools','Help'].forEach((m,i)=>tc(m,14+i*64,46,14,INK));}

/* ================= splash (XP dialog) ================= */
const DLG={x:W/2-330,y:H*.12,w:660,h:740};
const INPUT={x:DLG.x+40,y:DLG.y+236,w:580,h:76};
const CHIPS=['50','100','250','500'].map((v,i)=>({v,x:DLG.x+40+i*148,y:DLG.y+330,w:136,h:40}));

 if(s)tc(s,INPUT.x+22,INPUT.y+54,44,INK,'left','bold');else if(!S.focus)tc('$0',INPUT.x+22,INPUT.y+54,44,'#bbb','left','bold');
 if(S.focus&&Math.floor(t*2.2)%2==0){g.font=`bold 44px ${UI}`;const w=s?g.measureText(s).width:0;g.fillStyle=INK;g.fillRect(INPUT.x+24+w+3,INPUT.y+16,2,46)}
 tc('USD',INPUT.x+INPUT.w-20,INPUT.y+48,18,'#777','right');
 CHIPS.forEach(ch=>xpBtn(ch.x,ch.y,ch.w,ch.h,'$'+ch.v,inR(ch),S.amount===ch.v,false,15));

  if(!open){const ec={TP:GREEN,TP1:GREEN,BE:'#666',SL:RED}[z.exit];const el={TP:'TP',TP1:'TP 1/2',BE:'BE',SL:'SL'}[z.exit];tc(el+' '+(z.pct>=0?'+':'')+z.pct.toFixed(1)+'%',cols[3],yy,12,sel?'#fff':ec,'left','bold')}
  const pv=z.pnl*K,s=open?'open':(Math.abs(pv)<.005?money(0):(pv>=0?'+':'-')+money(Math.abs(pv)));tc(s,cols[4],yy,13,sel?'#fff':(open?'#777':(z.pnl>=0?GREEN:RED)),'right','bold')});
 tc('source: pump.fun  -  size '+RISK.size+'%  sl -'+RISK.sl+'%  tp +'+RISK.tp+'%',x+10,y+h-8,11,'#777');
 g.restore()}

function stats(y,t,a){const b=baseAt(t)*K,st=S.start;const n=doneCount(t);let wins=0;for(let i=0;i<n;i++)if(trades[i].pnl>0)wins++;
 const items=[['Balance',money(b)],['PnL',(b>=st?'+':'-')+money(Math.abs(b-st))],['Return',(b>=st?'+':'')+((b/st-1)*100).toFixed(1)+'%'],['Trades',String(n)],['Win rate',n?Math.round(wins/n*100)+'%':'—'],['Day limits','+'+RISK.dw+'% / -'+RISK.dl+'%']];
 const bw=(W-32-5*12)/6;items.forEach((it,i)=>{const bx=16+i*(bw+12);const k=cl(a*6-i*.6);if(k<=0)return;g.save();g.globalAlpha=k;
  if(i==0){rr(bx,y,bw,80,6);g.fillStyle=lg(y,y+80,[[0,'#3d95ff'],[.5,'#0058e6'],[1,'#003dbd']]);g.fill();tc(it[0],bx+14,y+24,13,'#dce8ff');tc(it[1],bx+14,y+62,30,'#fff','left','bold')}
  else{sunken(bx,y,bw,80);tc(it[0],bx+14,y+24,13,'#555');const pos=i==1||i==2;tc(it[1],bx+14,y+62,28,pos?(b>=st?GREEN:RED):INK,'left','bold')}
  g.restore()})}
function fmtDur(s){s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}

 const rv=s=>cl((t-s)/.9);stats(62,t,cl((t-4.7)/1.0));

 // status bar
 g.fillStyle=BEIGE;g.fillRect(3,H-TB-24,W-6,21);g.fillStyle=EDGE;g.fillRect(3,H-TB-25,W-6,1);

/* ================= loop ================= */
let scale=1,offX=0,offY=0;
function resize(){const d=window.devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;scale=Math.min(c.width/W,c.height/H);offX=(c.width-W*scale)/2;offY=(c.height-H*scale)/2}
addEventListener('resize',resize);resize();
function now(){return performance.now()/1000}
function loop(){const T=now();g.setTransform(1,0,0,1,0,0);g.fillStyle='#000';g.fillRect(0,0,c.width,c.height);
 g.setTransform(scale,0,0,scale,offX,offY);g.save();g.beginPath();g.rect(0,0,W,H);g.clip();g.globalAlpha=1;
 if(S.phase=='desk')desktop(T);
 else if(S.phase=='open'){desktop(T);const k=ez((T-S.openAt)/.5);const {x:ix,y:iy,w:iw}=ICON;const x=lerp(ix,0,k),y=lerp(iy,0,k),w=lerp(iw,W,k),h=lerp(iw,H,k);
  g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.translate(x,y);g.scale(w/W,h/H);splash(T);g.restore();
  g.strokeStyle='rgba(255,255,255,.8)';g.setLineDash([4,3]);g.strokeRect(x,y,w,h);g.setLineDash([]);if(k>=1)S.phase='splash'}
 else if(S.phase=='splash')splash(T);
 else if(S.phase=='fade'){const k=(T-S.runAt);splash(T);g.fillStyle=`rgba(0,0,0,${eo(k/.35)})`;g.fillRect(0,0,W,H);if(k>.35){S.phase='run';S.runAt=T}}
 else if(S.phase=='run'){const t=4.6+(T-S.runAt);ensure(t);terminal(t);if(t<4.9){g.fillStyle=`rgba(0,0,0,${1-eo((t-4.6)/.3)})`;g.fillRect(0,0,W,H)}}
 g.restore();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ================= input ================= */
function toLogical(e){const d=window.devicePixelRatio||1;S.mx=(e.clientX*d-offX)/scale;S.my=(e.clientY*d-offY)/scale}
function goFull(){const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen().catch(()=>{})}
function launch(){goFull();S.phase='open';S.openAt=now();S.sel=false}
function start(){if(!S.amount)S.amount='100';S.start=Math.max(1,Number(S.amount));K=S.start/100;S.focus=false;S.seed=Math.floor(Math.random()*1000);resetStreams();S.phase='fade';S.runAt=now();goFull()}
addEventListener('mousemove',e=>{toLogical(e);c.style.cursor=(S.phase=='desk'&&inR(ICON))||(S.phase=='splash'&&(inR(BTN)||inR(RBOX)||CHIPS.some(inR)))?'pointer':(S.phase=='splash'&&inR(INPUT)?'text':'default')});
addEventListener('mousedown',e=>{toLogical(e);S.down=true;
 if(S.phase=='desk'){goFull();S.sel=inR(ICON)}
 else if(S.phase=='splash'){if(inR(RBOX)){RISKI=(RISKI+1)%3;RISK=PRESETS[PK[RISKI]]}S.focus=inR(INPUT);const ch=CHIPS.find(inR);if(ch){S.amount=ch.v;S.focus=true}}});
addEventListener('mouseup',e=>{toLogical(e);S.down=false;if(S.phase=='splash'&&inR(BTN))start()});
addEventListener('dblclick',e=>{toLogical(e);if(S.phase=='desk'&&inR(ICON))launch()});
addEventListener('keydown',e=>{
 if(S.phase=='desk'&&e.key=='Enter'){launch();return}
 if(S.phase=='splash'){
  if(/^[0-9]$/.test(e.key)){S.focus=true;if(S.amount.length<7)S.amount=(S.amount+e.key).replace(/^0+/,'')}
  else if(e.key=='Backspace'){S.amount=S.amount.slice(0,-1)}
  else if(e.key=='Enter'){start()}
  e.preventDefault();return}
 if(S.phase=='run'&&(e.key=='r'||e.key=='R')){S.phase='splash';S.amount='';S.focus=false}
 if(e.key=='f'||e.key=='F')goFull();
});
